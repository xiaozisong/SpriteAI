[project]
name = "boomcat-agent"
version = "0.1.0"
description = "Boom Cat AI 创作平台 Agent 后端（FastAPI + LangGraph），承载多 Agent 编排、RAG、异步任务、可观测"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sse-starlette>=2.1",
    # 数据库
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Redis / 队列 / 缓存
    "redis>=5.0",
    # Agent 编排
    "langchain-openai>=0.1",
    "langchain-community>=0.2",
    "langchain-core>=0.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=1.0",
    "langsmith>=0.1",
    # 可观测
    "sentry-sdk>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
